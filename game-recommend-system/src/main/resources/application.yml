server:
  port: 8080

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # URL 格式：可被环境变量覆盖
    #   DB_HOST     默认 localhost
    #   DB_PORT     默认 3306
    #   DB_NAME     默认 game_recommend_db
    #   DB_USERNAME 默认 root
    #   DB_PASSWORD 默认 123456
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:game_recommend_db}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8&rewriteBatchedStatements=true&cachePrepStmts=true&useServerPrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    hikari:
      # 连接池优化
      maximum-pool-size: 30
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      # 连接验证
      connection-test-query: SELECT 1
      validation-timeout: 5000
      # 连接泄漏检测
      leak-detection-threshold: 60000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    # 开启二级缓存（需配合 @CacheNamespace 使用）
    cache-enabled: true
    # 延迟加载
    lazy-loading-enabled: true
    aggressive-lazy-loading: false
  global-config:
    db-config:
      id-type: auto
      # 逻辑删除配置
      logic-delete-field: isValid
      logic-delete-value: 0
      logic-not-delete-value: 1
  mapper-locations: classpath*:mapper/**/*.xml

logging:
  level:
    com.gamerec.gamerecommend: info
    # 开启慢SQL日志（超过500ms的查询会打印）
    com.gamerec.gamerecommend.mapper: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# ============================================================
# 自定义配置
# ============================================================
game-rec:
  # AI 大模型配置（默认使用智谱 BigModel 免费接入）
  #   AI_API_KEY 可被环境变量覆盖: AI_API_KEY=xxx
  #   未设置 key 时 AI 接口会返回友好提示，系统其它功能不受影响
  #   ★ 推荐方式：在系统前端页面「系统设置 → AI 设置」中填写 API Key，
  #     配置会保存到数据库 ai_settings 表，无需修改本文件、无需重启。
  ai:
    enabled: true
    # 默认值为空；优先级：数据库 ai_settings > 环境变量 AI_API_KEY > 本配置
    api-key: ${AI_API_KEY:}
    # 免费模型（智谱 2025 免费模型，128K 上下文，响应速度 1-3 秒）
    model: glm-4-flash-250414
    base-url: https://open.bigmodel.cn/api/paas/v4
    max-tokens: 1024
    temperature: 0.3
    timeout-seconds: 90
  # 推荐算法配置
  recommend:
    # User-CF 默认K值
    user-cf-default-top-k: 15
    # 推荐结果默认数量
    default-top-n: 10
    # 时间衰减率
    activity-decay-rate: 0.01
  # 数据缓存配置
  cache:
    # 评分矩阵缓存时间（秒）
    matrix-ttl: 3600
    # 物品相似度缓存时间（秒）
    item-similarity-ttl: 7200
